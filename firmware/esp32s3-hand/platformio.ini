[platformio]
default_envs = esp32s3-hand

[common]
; Native USB must run TinyUSB (not USB-Serial/JTAG) for HID.
; CDC on boot is disabled: UART0 is the control channel.
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  ; Core 3.x USB host MSC includes FS.h; keep it on the include path.
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
lib_deps =
  bblanchon/ArduinoJson@^6.21.5

[env:esp32s3-hand]
; Default: HID touchscreen for Android 16 (absolute mouse is not registered
; by Android; see docs/hid-modes.md).
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
upload_speed = 921600

; ESP32-S3-N16R8: 16 MB flash, 8 MB OPI PSRAM
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv

build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} -DHAND_HID_TOUCHSCREEN=1
lib_deps = ${common.lib_deps}

[env:esp32s3-hand-abs]
; Fallback for hosts that support the core's absolute mouse (e.g. iOS).
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
upload_speed = 921600

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv

build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} -DHAND_HID_TOUCHSCREEN=0
lib_deps = ${common.lib_deps}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-console"
version = "0.1.0"
description = "ESP32-S3 USB HID phone control: capture, OCR, scenario runner and local HTTP service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ldchaowin", email = "ldchao@outlook.com" }]
keywords = ["esp32", "hid", "android", "automation", "ocr", "scrcpy"]
dependencies = ["pyserial>=3.5"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/ldchaowin/assistantAgent"
Repository = "https://github.com/ldchaowin/assistantAgent"

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.24", "pillow>=10"]
vision = [
    "numpy>=1.24",
    "pillow>=10",
    "opencv-python>=4.8",
    "rapidocr-onnxruntime>=1.4,<2",
]
# Live H.264 decoding for `phone eye --scrcpy/--screenrecord`
# (PyAV ships its own FFmpeg libraries, no system ffmpeg needed).
stream = [
    "av>=12",
    "numpy>=1.24",
]
# AirPlay / iPhone Mirroring window capture (plan B for iOS: hand owns the USB port)
mirror = ["pyobjc-framework-Quartz>=10"]

# BLE provisioning (Espressif Network Provisioner client)
provision = [
    "bleak>=0.22",
    "protobuf>=4",
    "cryptography>=41",
]

[project.scripts]
phone = "phone_console.cli:main"

[tool.setuptools.packages.find]
include = ["phone_console*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
"phone_console.provisioning.vendor" = ["LICENSE-APACHE-2.0.txt", "VENDORED.md"]
"phone_console.provisioning.vendor.esp_prov" = ["**/*"]

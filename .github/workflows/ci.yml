name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -U pip
      - run: pip install -e 'console[vision]' pytest
      - name: Python tests
        run: cd console && python -m pytest -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: cd dsh-plugin-phone && npm install --no-audit --no-fund
      - name: Plugin tests
        run: cd dsh-plugin-phone && node --test test/*.test.mjs
